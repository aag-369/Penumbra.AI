services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: penumbra
      POSTGRES_USER: penumbra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penumbra"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: postgresql://penumbra:${DB_PASSWORD}@postgres:5432/penumbra
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KEYSTORE_DIR: /app/keystore
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      # Public CKKS contexts are tens of megabytes each and must survive a
      # container rebuild, or every user has to re-register their key.
      - keystore_data:/app/keystore
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  keystore_data:
