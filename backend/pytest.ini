[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: takes more than a few seconds (benchmarks, large key generation)
    benchmark: performance comparison, not a correctness assertion
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:app.middleware.*
