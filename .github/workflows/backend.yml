name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-secret-not-used-outside-this-job-0123456789
          # bcrypt at cost 12 dominates CI time; 10 is the documented floor.
          BCRYPT_ROUNDS: "10"
        run: pytest -q --cov=app --cov-report=term --cov-report=xml

      - name: Enforce coverage on the crypto layer
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          # The crypto layer is the privacy guarantee. Everything else can slip;
          # this cannot.
          threshold = 0.90
          failed = []
          for cls in root.iter("class"):
              filename = cls.get("filename", "")
              if "/crypto/" not in filename:
                  continue
              rate = float(cls.get("line-rate", 0))
              if rate < threshold:
                  failed.append(f"{filename}: {rate:.0%} < {threshold:.0%}")
          if failed:
              print("crypto coverage below threshold:")
              print("\n".join("  " + f for f in failed))
              sys.exit(1)
          print("crypto layer coverage OK")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install bandit pip-audit

      - name: Static security scan
        run: bandit -r app -ll

      - name: Dependency audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: No secret-key material in the tree
        run: |
          # A public context in the repository is untidy. A *private* one is a
          # disclosed key. Fail the build on either.
          if git ls-files | grep -Ei '\.(ctx|sealed)$'; then
            echo "key material committed to the repository"; exit 1
          fi
          if grep -rn "export_private_context()" --include="*.py" app/ | grep -v "ckks_engine.py"; then
            echo "note: review each call site above -- private contexts must never be persisted server-side"
          fi
